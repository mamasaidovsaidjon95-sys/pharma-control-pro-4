:root{font-family:system-ui,Arial;color:#17324d;background:#eef3f8}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#10315b,#156b9a);color:white;padding:20px}header h1{margin:0;font-size:23px}header small{opacity:.86}nav{display:flex;gap:7px;overflow:auto;background:white;padding:10px;position:sticky;top:0;z-index:4;box-shadow:0 2px 8px #0001}button{background:#12649f;color:white;border:0;border-radius:9px;padding:10px 13px;font-weight:650;cursor:pointer}nav button{background:#e8f1f8;color:#174265;white-space:nowrap}nav button.active{background:#123765;color:white}main{max-width:1200px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.panel{background:white;padding:17px;border-radius:13px;margin-bottom:13px;box-shadow:0 2px 8px #102a4410}.card strong{display:block;font-size:23px;margin-top:8px}h2{margin:8px 0 16px}h3{margin:2px 0 13px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:11px}label{font-size:13px;font-weight:650}input,select,textarea{width:100%;border:1px solid #cbd8e3;border-radius:8px;padding:10px;margin-top:5px;background:white;font-size:15px}textarea{min-height:65px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid #e5ebf0;white-space:nowrap}th{background:#f2f6f9}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:10px 0}.row>*{max-width:250px}.danger{background:#b52c42}.soft{background:#e7eff7;color:#173c61}.notice{padding:13px;border-radius:10px;background:#fff0cc;margin:12px 0}.ok{background:#e2f5e9}.muted{color:#637b8d;font-size:13px}.bad{color:#bd293c}.hide{display:none}footer{text-align:center;padding:24px;color:#789;font-size:12px}@media(max-width:650px){main{padding:10px}header h1{font-size:20px}form{grid-template-columns:1fr 1fr}form label{min-width:0}input,select{font-size:16px}}@media(max-width:390px){form{grid-template-columns:1fr}}

</style></head><body><header><h1>💊 PHARMA CONTROL PRO</h1><small>4.0 sinov • Savdo • Ombor • FEFO • Hisobotlar</small></header><nav id="nav"></nav><main id="app"></main><footer>Offline demo: ma’lumotlar faqat ushbu brauzerda saqlanadi. Har kuni JSON zaxira oling.</footer><script>
'use strict';
const KEY='pharma-control-pro-v4-preview',OLD='pharma-control-pro-v1',REGIONS=['Qoraqalpog‘iston','Toshkent shahri','Toshkent viloyati','Andijon','Buxoro','Farg‘ona','Jizzax','Xorazm','Namangan','Navoiy','Qashqadaryo','Samarqand','Sirdaryo','Surxondaryo'];
const TABS=[['home','📊 Bosh sahifa'],['meds','💊 Dorilar'],['expiry','📅 Seriya va muddat'],['wh','🏬 Omborlar'],['staff','👨‍💼 Xodimlar'],['pharm','🏥 Mijozlar'],['orders','📋 Zakazlar'],['buy','📥 Kirim'],['transfer','🚚 Ko‘chirish'],['sell','🛒 Savdo'],['returns','↩️ Vozvrat'],['quarantine','☣️ Yaroqsiz dorilar'],['pay','💳 To‘lov'],['debt','📕 Qarzdorlik'],['expenses','💸 Xarajat'],['plans','🎯 Rejalar'],['report','📈 Hisobot'],['audit','🕓 Tarix'],['settings','⚙️ Sozlamalar']];
const arrays=['meds','wh','staff','pharm','buys','transfers','sales','payments','expenses','plans','audit','orders','returns','disposals'];
let db;try{db=JSON.parse(localStorage.getItem(KEY))||null}catch{}if(!db){try{let old=null;if(old&&Array.isArray(old.meds)){db={...old};db.wh=[{id:'main',name:'Markaziy ombor',region:'Toshkent shahri'}];(db.buys||[]).forEach(x=>{x.wh='main';x.cost=Number(db.meds.find(m=>m.id===x.med)?.cost||0)});(db.sales||[]).forEach(x=>{x.wh='main';x.cost=Number(db.meds.find(m=>m.id===x.med)?.cost||0)});db.transfers=[];db.expenses=[];db.plans=[];db.audit=[]}}catch{}}if(!db)db={};for(const k of arrays)if(!Array.isArray(db[k]))db[k]=[];if(!db.wh.length)db.wh.push({id:'main',name:'Markaziy ombor',region:'Toshkent shahri'});
let page='home',filters={from:'',to:'',region:''};const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=x=>Number(x)||0,money=x=>new Intl.NumberFormat('uz-UZ',{maximumFractionDigits:2}).format(num(x))+' so‘m',uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random(),date=()=>new Date().toISOString().slice(0,10),get=(k,id)=>db[k].find(x=>x.id===id),name=(k,id)=>get(k,id)?.name||'—',sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0),within=(x,from,to)=>(!from||x.date>=from)&&(!to||x.date<=to);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Xotiraga saqlab bo‘lmadi. JSON zaxira oling.');return false}}function log(action,detail){db.audit.unshift({id:uid(),date:new Date().toLocaleString('uz-UZ'),action,detail});db.audit=db.audit.slice(0,2000)}
function stock(m,w){return sum(db.buys.filter(x=>x.med===m&&(!w||x.wh===w)),x=>num(x.qty))+sum(db.transfers.filter(x=>x.med===m&&(!w||x.to===w)),x=>num(x.qty))-sum(db.transfers.filter(x=>x.med===m&&(!w||x.from===w)),x=>num(x.qty))-sum(db.sales.filter(x=>x.med===m&&(!w||x.wh===w)),x=>num(x.qty))+sum(db.returns.filter(x=>x.med===m&&x.condition==='Sotishga yaroqli'&&(!w||x.wh===w)),x=>num(x.qty))}function fefoPlan(medId,wh,qty){const selected=get('meds',medId);if(!selected)return null;let batches=db.meds.filter(m=>m.name.trim().toLocaleLowerCase()===selected.name.trim().toLocaleLowerCase()&&m.exp&&m.exp>=date()&&stock(m.id,wh)>0).sort((a,b)=>a.exp.localeCompare(b.exp)||String(a.batch).localeCompare(String(b.batch)));let left=qty,parts=[];for(const m of batches){let take=Math.min(left,stock(m.id,wh));if(take>0){parts.push({med:m.id,qty:take,batch:m.batch,exp:m.exp});left-=take}if(!left)break}return left?null:parts}
function badQty(m,w){return sum(db.returns.filter(x=>x.med===m&&x.wh===w&&x.condition!=='Sotishga yaroqli'),x=>num(x.qty))-sum(db.disposals.filter(x=>x.med===m&&x.wh===w),x=>num(x.qty))}function debt(p){return sum(db.sales.filter(x=>x.pharm===p),x=>num(x.total))-sum(db.payments.filter(x=>x.pharm===p),x=>num(x.amount))-sum(db.returns.filter(x=>x.pharm===p),x=>num(x.total))}
function options(a,fn){return '<option value="">Tanlang</option>'+a.map(x=>`<option value="${esc(x.id)}">${esc(fn(x))}</option>`).join('')}function regions(){return '<option value="">Hududni tanlang</option>'+REGIONS.map(x=>`<option>${esc(x)}</option>`).join('')}function field(label,key,type='text',attrs=''){return `<label>${label}<input name="${key}" type="${type}" ${attrs} required></label>`}function select(label,key,opts){return `<label>${label}<select name="${key}" required>${opts}</select></label>`}function optional(label,key){return `<label>${label}<input name="${key}"></label>`}function form(title,kind,fields,caption='Saqlash'){return `<div class="panel"><h3>${title}</h3><form data-kind="${kind}">${fields}<button>${caption}</button></form></div>`}function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}">Ma’lumot yo‘q</td></tr>`}</tbody></table></div>`}function row(c){return '<tr>'+c.map(x=>`<td>${x}</td>`).join('')+'</tr>'}function remove(k,x){return `<button class="danger" data-del="${k}" data-id="${esc(x.id)}">O‘chirish</button>`}function card(label,val){return `<div class="card">${label}<strong>${val}</strong></div>`}function wrap(title,content){return `<div class="panel"><h3>${title}</h3>${content}</div>`}function whopt(){return options(db.wh,x=>x.name+' / '+x.region)}function medopt(){return options(db.meds,x=>x.name+' / '+x.batch)}function pharmopt(){return options(db.pharm,x=>x.name)}function staffopt(){return options(db.staff,x=>x.name)}function download(filename,body,mime){let url=URL.createObjectURL(new Blob([body],{type:mime})),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function render(){ $('#nav').innerHTML=TABS.map(([k,n])=>`<button data-page="${k}" class="${page===k?'active':''}">${n}</button>`).join('');let html='';
if(page==='home'){let total=sum(db.sales,x=>num(x.total))-sum(db.returns,x=>num(x.total)),paid=sum(db.payments,x=>num(x.amount)),debts=sum(db.pharm,x=>Math.max(0,debt(x.id))),low=db.meds.filter(x=>stock(x.id)<=num(x.min)),exp=db.meds.filter(x=>x.exp&&x.exp<=new Date(Date.now()+30*86400000).toISOString().slice(0,10));html='<h2>Boshqaruv paneli</h2><div class="notice"><b>🧪 4.0 boshlang‘ich sinov versiyasi.</b> Hozircha barcha ma’lumotlar faqat shu qurilmada saqlanadi. Direktor/xodim loginlari, umumiy tarmoq, server sinxronlash va litsenziyalar hali mavjud emas. Haqiqiy mijoz ma’lumotlarini kiritmang.</div><div class="grid">'+card('💰 Jami savdo',money(total))+card('💳 Jami tushum',money(paid))+card('📕 Qarzdorlik',money(debts))+card('↩️ Vozvrat summasi',money(sum(db.returns,x=>num(x.total))))+card('☣️ Yaroqsiz zaxira',sum(db.meds,m=>sum(db.wh,w=>badQty(m.id,w.id)))+' ta')+card('📦 Qoldiq birliklar',sum(db.meds,x=>stock(x.id))+' ta')+card('🏥 Mijozlar',db.pharm.length)+card('📋 Zakazlar',db.orders.length)+card('🏬 Omborlar',db.wh.length)+card('⚠️ Kam qolgan',low.length)+card('⏳ Muddat yaqin',exp.length)+'</div><div class="notice">Bu demo faqat bitta brauzerda ishlaydi. GitHub Pages ommaviy sahifa bo‘lishi mumkin: haqiqiy mijozlar, telefon raqamlari va savdo ma’lumotlarini hozircha kiritmang.</div>'+wrap('Ogohlantirishlar',[...low.map(x=>`⚠️ ${esc(x.name)}: ${stock(x.id)} ta qoldi`),...exp.map(x=>`⏳ ${esc(x.name)}: muddat ${esc(x.exp)}`)].map(x=>'<p>'+x+'</p>').join('')||'Ogohlantirish yo‘q')}
if(page==='expiry'){let today=date(),soon=new Date(Date.now()+90*86400000).toISOString().slice(0,10);let items=db.meds.map(m=>({m,qty:stock(m.id),status:!m.exp?'Muddat kiritilmagan':m.exp<today?'MUDDATI O‘TGAN':m.exp<=soon?'90 kun ichida tugaydi':'Yaroqli'}));html='<h2>📅 Seriyalar va yaroqlilik nazorati</h2><div class="notice">Har bir seriya Dorilar bo‘limida alohida yaratiladi. Savdo va zakazdan yetkazishda muddati o‘tgan seriya bloklanadi. FEFO (eng yaqin muddatli seriyadan birinchi sotish) uchun quyidagi ro‘yxatni tekshiring. Savdo bo‘limidagi «Avtomatik FEFO savdo» shakli yaroqli seriyalarni muddati bo‘yicha ajratadi. Zakazdan yetkazish hali qo‘lda tanlangan seriya asosida ishlaydi.</div>'+wrap('Seriyalar bo‘yicha nazorat',table(['Dori','Seriya','Muddat','Qoldiq','Holat','Omborlar'],items.sort((a,b)=>(a.m.exp||'9999').localeCompare(b.m.exp||'9999')).map(x=>row([esc(x.m.name),esc(x.m.batch),esc(x.m.exp),x.qty,esc(x.status),db.wh.map(w=>esc(w.name)+': '+stock(x.m.id,w.id)).join('<br>')]))))+wrap('Ogohlantirishlar',`<p>🔴 Muddati o‘tgan seriyalar: <b>${items.filter(x=>x.status==='MUDDATI O‘TGAN'&&x.qty>0).length}</b></p><p>🟡 90 kun ichida muddati tugaydigan seriyalar: <b>${items.filter(x=>x.status==='90 kun ichida tugaydi'&&x.qty>0).length}</b></p>`)}
if(page==='meds')html='<h2>Dorilar katalogi</h2>'+form('Dori qo‘shish','meds',field('Dori nomi','name')+optional('Ishlab chiqaruvchi','maker')+field('Seriya','batch')+field('Yaroqlilik','exp','date')+field('Olish narxi','cost','number','min="0" step="0.01"')+field('Sotish narxi','price','number','min="0" step="0.01"')+field('Minimal qoldiq','min','number','min="0" value="5"'))+wrap('Dorilar',table(['Nomi','Seriya','Muddat','Olish','Sotish','Qoldiq','Amal'],db.meds.map(x=>row([esc(x.name),esc(x.batch),esc(x.exp),money(x.cost),money(x.price),stock(x.id),remove('meds',x)]))));
if(page==='wh')html='<h2>Omborlar</h2>'+form('Ombor qo‘shish','wh',field('Ombor nomi','name')+select('Hudud','region',regions()))+wrap('Omborlar',table(['Nomi','Hudud','Birliklar','Amal'],db.wh.map(x=>row([esc(x.name),esc(x.region),sum(db.meds,m=>stock(m.id,x.id)),remove('wh',x)]))));
if(page==='staff')html='<h2>Xodimlar va vakillar</h2>'+form('Xodim qo‘shish','staff',field('F.I.Sh.','name')+optional('Telefon','phone')+select('Lavozim','role','<option>Direktor</option><option>Administrator</option><option>Menejer</option><option>Firma vakili</option><option>Omborchi</option><option>Buxgalter</option>')+select('Hudud','region',regions()))+wrap('Xodimlar',table(['F.I.Sh.','Lavozim','Hudud','Telefon','Mijozlar','Amal'],db.staff.map(x=>row([esc(x.name),esc(x.role),esc(x.region),esc(x.phone),db.pharm.filter(p=>p.staff===x.id).length,remove('staff',x)]))));
if(page==='pharm')html='<h2>Aptekalar va firmalar — mijozlar</h2>'+form('Yangi mijoz qo‘shish','pharm',field('Mijoz nomi','name')+select('Mijoz turi','type','<option>Apteka</option><option>Ulgurji firma</option><option>Distribyutor</option><option>Klinika / shifoxona</option><option>Boshqa</option>')+select('Hudud','region',regions())+optional('Manzil','address')+optional('Telefon','phone')+select('Bitta mas’ul vakil','staff',staffopt()))+'<p class="muted">Avval Xodimlar bo‘limida vakil qo‘shing. Mijozga aynan bitta vakil biriktiriladi.</p>'+wrap('Mijozlar',table(['Nomi','Turi','Hudud','Vakil','Balans','Amal'],db.pharm.map(x=>row([esc(x.name),esc(x.type||'Apteka'),esc(x.region),esc(name('staff',x.staff)),money(debt(x.id)),remove('pharm',x)]))));
if(page==='orders'){let active=db.orders.filter(o=>!['Bekor qilindi','Savdoga o‘tdi'].includes(o.status));html='<h2>📋 Zakazlar</h2><div class="notice">Apteka ham, firma vakili ham buyurtma kiritishi mumkin. Bitta zakazga bir nechta dori qo‘shiladi. Zakazning o‘zi omborni kamaytirmaydi; faqat yetkazilgan miqdor savdoga o‘tadi. Qolgan miqdorni keyingi kuni yetkazish mumkin.</div>'+`<div class="panel"><h3>Yangi zakaz</h3><form id="orderForm"><label>Buyurtmachi (apteka / firma)<select name="pharm" required>${pharmopt()}</select></label><label>Zakaz kim tomonidan kiritildi?<select name="origin" required><option value="Apteka">Apteka tomonidan</option><option value="Firma vakili">Firma vakili tomonidan</option></select></label><label>Yetkazib beruvchi firma<input name="supplier" placeholder="Firma nomi" required></label><label>Ombor<select name="wh" required>${whopt()}</select></label><label>Zakaz sanasi<input type="date" name="date" value="${date()}" required></label><label>Yetkazish muddati<input type="date" name="due" required></label><div style="grid-column:1/-1"><b>Dorilar ro‘yxati</b><div id="orderLines"></div><button type="button" class="soft" id="addLine">➕ Dori qo‘shish</button></div><label>Izoh<input name="note"></label><button type="submit">📋 Zakazni saqlash</button></form></div>`+wrap('Zakazlar ('+active.length+' faol)',table(['Sana','Mijoz','Vakil','Kim kiritdi','Firma','Dorilar','Jami','Holat','Amal'],[...db.orders].reverse().map(o=>{let rem=o.items.map(i=>Math.max(0,num(i.qty)-num(i.delivered))),pending=rem.some(q=>q>0);let actions=!pending?'✅ To‘liq bajarilgan':o.status==='Bekor qilindi'?'❌ Bekor qilingan':`<select data-order-status="${esc(o.id)}"><option>${esc(o.status)}</option>${['Yangi','Tasdiqlandi','Jo‘natildi','Yetkazildi','Qisman bajarildi'].filter(x=>x!==o.status).map(x=>`<option>${x}</option>`).join('')}</select> <button data-convert="${esc(o.id)}">📦 Qisman / to‘liq bajarish</button> <button class="danger" data-cancel-order="${esc(o.id)}">Qoldiqni bekor qilish</button>`;return row([esc(o.date),esc(name('pharm',o.pharm)),esc(name('staff',get('pharm',o.pharm)?.staff)),esc(o.origin),esc(o.supplier),o.items.map(i=>esc(name('meds',i.med))+' × '+i.qty+' (berildi: '+num(i.delivered)+', qoldi: '+Math.max(0,num(i.qty)-num(i.delivered))+')').join('<br>'),money(sum(o.items,i=>i.qty*i.price)),esc(o.status),actions])})));}

if(page==='buy')html='<h2>Tovar kirimi</h2>'+form('Omborga qabul qilish','buys',select('Dori','med',medopt())+select('Ombor','wh',whopt())+field('Miqdor','qty','number','min="1" step="1"')+field('Kirim narxi','cost','number','min="0" step="0.01"')+field('Sana','date','date',`value="${date()}"`)+optional('Yetkazib beruvchi','supplier'),'Kirim qilish')+wrap('Kirimlar',table(['Sana','Ombor','Dori','Miqdor','Narx','Yetkazuvchi','Amal'],[...db.buys].reverse().map(x=>row([esc(x.date),esc(name('wh',x.wh)),esc(name('meds',x.med)),x.qty,money(x.cost),esc(x.supplier),remove('buys',x)]))));
if(page==='transfer')html='<h2>Omborlararo ko‘chirish</h2>'+form('Tovar ko‘chirish','transfers',select('Dori','med',medopt())+select('Qaysi ombordan','from',whopt())+select('Qaysi omborga','to',whopt())+field('Miqdor','qty','number','min="1" step="1"')+field('Sana','date','date',`value="${date()}"`),'Ko‘chirish')+wrap('Ko‘chirish tarixi',table(['Sana','Dori','Qayerdan','Qayerga','Miqdor','Amal'],[...db.transfers].reverse().map(x=>row([esc(x.date),esc(name('meds',x.med)),esc(name('wh',x.from)),esc(name('wh',x.to)),x.qty,remove('transfers',x)]))));
if(page==='sell')html='<h2>Savdo</h2>'+`<div class="panel"><h3>⚡ Avtomatik FEFO savdo</h3><p class="muted">Bir xil nomdagi dorilarning yaroqli seriyalari eng yaqin muddatdan boshlab avtomatik tanlanadi. Bir nechta seriyadan sotish mumkin.</p><form id="fefoForm"><label>Mijoz<select name="pharm" required>${pharmopt()}</select></label><label>Dori nomi (istalgan seriya)<select name="med" required>${medopt()}</select></label><label>Ombor<select name="wh" required>${whopt()}</select></label><label>Jami miqdor<input type="number" name="qty" min="1" step="1" required></label><label>Bir dona narxi<input type="number" name="price" min="0" step="0.01" required></label><label>Sana<input type="date" name="date" value="${date()}" required></label><button>FEFO bo‘yicha sotish</button></form></div>`+form('Qo‘lda seriya tanlab savdo','sales',select('Mijoz (apteka / firma)','pharm',pharmopt())+select('Dori','med',medopt())+select('Ombor','wh',whopt())+field('Miqdor','qty','number','min="1" step="1"')+field('Sotish narxi (1 dona)','price','number','min="0" step="0.01"')+field('Sana','date','date',`value="${date()}"`),'Savdoni qayd etish')+fefoHistory()+wrap('Sotuvlar — seriyalar kesimida',table(['Sana','Operatsiya','Mijoz','Ombor','Dori','Seriya','Yaroqlilik','Miqdor','Summa','Amal'],[...db.sales].reverse().map(x=>{let med=get('meds',x.med);return row([esc(x.date),x.fefoGroup?'FEFO-'+esc(String(x.fefoGroup).slice(0,8)):x.orderId?'ZAKAZ':'Qo‘lda',esc(name('pharm',x.pharm)),esc(name('wh',x.wh)),esc(name('meds',x.med)),esc(med?.batch||'—'),esc(med?.exp||'—'),x.qty,money(x.total),remove('sales',x)])})));
function fefoHistory(){let groups=new Map();for(const x of db.sales){if(!x.fefoGroup)continue;if(!groups.has(x.fefoGroup))groups.set(x.fefoGroup,[]);groups.get(x.fefoGroup).push(x)}let entries=[...groups.entries()].reverse();return wrap('⚡ FEFO operatsiyalari tarixi',entries.length?entries.map(([id,rows])=>{let first=rows[0];return `<details class="panel"><summary><b>FEFO-${esc(String(id).slice(0,8))}</b> · ${esc(first.date)} · ${esc(name('pharm',first.pharm))} · ${sum(rows,x=>num(x.qty))} ta · ${money(sum(rows,x=>num(x.total)))}</summary><div class="scroll">${table(['Dori','Seriya','Yaroqlilik','Miqdor','Narx','Summa'],rows.map(x=>{let m=get('meds',x.med);return row([esc(m?.name||'—'),esc(m?.batch||'—'),esc(m?.exp||'—'),x.qty,money(x.price),money(x.total)])}))}</div><p class="muted">Bir operatsiyadagi seriyalar yaroqlilik muddati bo‘yicha ajratilgan. Oldingi yozuvlarda seriya ma’lumoti dori kartasidan olinadi.</p></details>`}).join(''):'Hali FEFO savdosi yo‘q')}

if(page==='expenses')html='<h2>Xarajatlar</h2>'+form('Xarajat kiritish','expenses',field('Xarajat nomi','name')+field('Summa','amount','number','min="0" step="0.01"')+select('Hudud','region',regions())+field('Sana','date','date',`value="${date()}"`))+wrap('Xarajatlar',table(['Sana','Nomi','Hudud','Summa','Amal'],[...db.expenses].reverse().map(x=>row([esc(x.date),esc(x.name),esc(x.region),money(x.amount),remove('expenses',x)]))));

if(page==='report'){let from=filters.from,to=filters.to,ss=db.sales.filter(x=>within(x,from,to)),pp=db.payments.filter(x=>within(x,from,to)),ex=db.expenses.filter(x=>within(x,from,to)),revenue=sum(ss,x=>num(x.total))-sum(db.returns.filter(x=>within(x,from,to)),x=>num(x.total)),cost=sum(ss,x=>num(x.qty)*num(x.cost))-sum(db.returns.filter(x=>within(x,from,to)),x=>num(x.qty)*num(x.cost));html='<h2>Hisobotlar</h2>'+`<div class="panel row"><label>Boshlanish<input id="from" type="date" value="${esc(from)}"></label><label>Tugash<input id="to" type="date" value="${esc(to)}"></label><button id="filter">Ko‘rsatish</button><button id="week" class="soft">7 kun</button><button id="month" class="soft">30 kun</button><button id="all" class="soft">Barcha vaqt</button></div>`+'<div class="grid">'+card('Savdo',money(revenue))+card('Tushum',money(sum(pp,x=>num(x.amount))))+card('Taxminiy yalpi foyda',money(revenue-cost))+card('Xarajatlar',money(sum(ex,x=>num(x.amount))))+card('Taxminiy natija',money(revenue-cost-sum(ex,x=>num(x.amount))))+card('Savdolar',ss.length)+'</div>'+wrap('Hududlar bo‘yicha aylanma',table(['Hudud','Savdo','To‘lov'],REGIONS.map(r=>row([esc(r),money(sum(ss.filter(s=>get('pharm',s.pharm)?.region===r),s=>num(s.total))),money(sum(pp.filter(p=>get('pharm',p.pharm)?.region===r),p=>num(p.amount)))]))))+wrap('Mijozlar bo‘yicha aylanma',table(['Mijoz','Savdo','To‘lov'],db.pharm.map(p=>row([esc(p.name),money(sum(ss.filter(s=>s.pharm===p.id),s=>num(s.total))),money(sum(pp.filter(x=>x.pharm===p.id),x=>num(x.amount)))]))))+'<button id="csv">⬇️ Savdolar CSV</button><p class="muted">Foyda taxminiy: savdo vaqtidagi xarid narxiga asoslanadi; soliq va boshqa hisoblar kiritilmagan.</p>'}
if(page==='audit')html='<h2>O‘zgarishlar tarixi</h2>'+wrap('Oxirgi amallar (mahalliy demo)',table(['Vaqt','Amal','Tafsilot'],db.audit.map(x=>row([esc(x.date),esc(x.action),esc(x.detail)]))));
if(page==='quarantine'){let entries=db.meds.flatMap(m=>db.wh.map(w=>({m,w,qty:badQty(m.id,w.id)}))).filter(x=>x.qty>0);html='<h2>☣️ Yaroqsiz dorilar nazorati</h2><div class="notice">Yaroqsiz qaytgan dorilar sotiladigan omborga qo‘shilmaydi. Utilizatsiya qaydi faqat alohida hisobdan kamaytiradi. Haqiqiy utilizatsiya qonuniy tartibda rasmiylashtirilishi kerak.</div>'+wrap('Alohida yaroqsiz zaxira',table(['Dori','Seriya','Yaroqlilik','Ombor','Qolgan miqdor'],entries.map(x=>row([esc(x.m.name),esc(x.m.batch),esc(x.m.exp),esc(x.w.name),x.qty]))))+form('Utilizatsiyani qayd etish','disposals',select('Dori','med',medopt())+select('Ombor','wh',whopt())+field('Miqdor','qty','number','min="1" step="1"')+field('Sana','date','date',`value="${date()}"`)+field('Dalolatnoma raqami','document')+select('Usul','method','<option>Utilizatsiyaga topshirildi</option><option>Yo‘q qilindi (dalolatnoma bilan)</option>')+optional('Izoh','note'),'Utilizatsiyani qayd etish')+wrap('Yaroqsiz qaytishlar',table(['Sana','Mijoz','Dori','Seriya','Miqdor','Sabab'],db.returns.filter(x=>x.condition!=='Sotishga yaroqli').map(x=>row([esc(x.date),esc(name('pharm',x.pharm)),esc(name('meds',x.med)),esc(get('meds',x.med)?.batch),x.qty,esc(x.note)]))))+wrap('Utilizatsiya tarixi',table(['Sana','Dori','Ombor','Miqdor','Dalolatnoma','Usul'],[...db.disposals].reverse().map(x=>row([esc(x.date),esc(name('meds',x.med)),esc(name('wh',x.wh)),x.qty,esc(x.document),esc(x.method)]))))}

function addOrderLine(){let box=$('#orderLines');if(!box)return;let div=document.createElement('div');div.className='row order-line';div.style.maxWidth='none';div.innerHTML=`<label style="flex:2;min-width:145px">Dori<select class="ol-med" required>${medopt()}</select></label><label style="flex:1;min-width:85px">Miqdor<input class="ol-qty" type="number" min="1" step="1" required></label><label style="flex:1;min-width:110px">Narx<input class="ol-price" type="number" min="0" step="0.01" required></label><button type="button" class="danger" data-remove-line>✕</button>`;box.append(div)}
function orderItems(){return [...document.querySelectorAll('.order-line')].map(el=>({med:el.querySelector('.ol-med').value,qty:Number(el.querySelector('.ol-qty').value),price:Number(el.querySelector('.ol-price').value)}))}
function nav(p){page=p;render();scrollTo(0,0)}
function dependencies(k,id){if(k==='meds')return db.disposals.some(x=>x.med===id)||db.returns.some(x=>x.med===id)||db.orders.some(o=>o.items.some(i=>i.med===id))||db.buys.some(x=>x.med===id)||db.sales.some(x=>x.med===id)||db.transfers.some(x=>x.med===id);if(k==='wh')return db.disposals.some(x=>x.wh===id)||db.returns.some(x=>x.wh===id)||db.orders.some(o=>o.wh===id)||db.buys.some(x=>x.wh===id)||db.sales.some(x=>x.wh===id)||db.transfers.some(x=>x.from===id||x.to===id);if(k==='pharm')return db.returns.some(x=>x.pharm===id)||db.sales.some(x=>x.pharm===id)||db.payments.some(x=>x.pharm===id)||db.orders.some(x=>x.pharm===id);if(k==='staff')return db.pharm.some(x=>x.staff===id)||db.plans.some(x=>x.staff===id);return false}
document.addEventListener('click',e=>{if(e.target.id==='addLine'){addOrderLine();return}if(e.target.matches('[data-remove-line]')){if(document.querySelectorAll('.order-line').length>1)e.target.closest('.order-line').remove();return}let cancel=e.target.closest('[data-cancel-order]');if(cancel){let o=get('orders',cancel.dataset.cancelOrder);if(!o||['Bekor qilindi','Savdoga o‘tdi'].includes(o.status))return;if(!confirm('Zakazning yetkazilmagan qismini bekor qilasizmi? Avval yetkazilgan savdolar saqlanadi.'))return;o.status='Bekor qilindi';log('Zakaz qoldig‘i bekor qilindi',o.id);save();render();return}
let cv=e.target.closest('[data-convert]');if(cv){let o=get('orders',cv.dataset.convert);if(!o||['Bekor qilindi','Savdoga o‘tdi'].includes(o.status))return;
let planned=[],remainingStock={};for(const i of o.items){let remain=Math.max(0,num(i.qty)-num(i.delivered));if(!remain)continue;let medRecord=get('meds',i.med);if(!medRecord?.exp||medRecord.exp<date()){alert(name('meds',i.med)+' seriyasining muddati o‘tgan yoki kiritilmagan. Yetkazish bloklandi.');return}let available=remainingStock[i.med]??stock(i.med,o.wh);let suggested=Math.min(remain,Math.max(0,available));let raw=prompt(name('meds',i.med)+'\nZakaz qoldig‘i: '+remain+' ta\nOmborda: '+available+' ta\nHozir nechta yetkaziladi?',String(suggested));if(raw===null)return;let q=Number(raw.trim());if(!Number.isInteger(q)||q<0||q>remain||q>available){alert('Miqdor noto‘g‘ri. 0 dan '+Math.min(remain,available)+' gacha kiriting.');return}planned.push({item:i,qty:q});remainingStock[i.med]=available-q}
if(!planned.some(x=>x.qty>0)){alert('Yetkaziladigan miqdor 0. Savdo yaratilmagan.');return}let total=sum(planned,x=>x.qty*num(x.item.price));if(!confirm('Hozir '+planned.reduce((n,x)=>n+x.qty,0)+' ta dori, jami '+money(total)+' savdoga o‘tkazilsinmi?'))return;
for(const {item:i,qty:q} of planned){if(!q)continue;db.sales.push({id:uid(),pharm:o.pharm,med:i.med,wh:o.wh,qty:q,price:num(i.price),total:q*num(i.price),cost:num(get('meds',i.med)?.cost),date:date(),orderId:o.id});i.delivered=num(i.delivered)+q}
o.status=o.items.every(i=>num(i.delivered)>=num(i.qty))?'Savdoga o‘tdi':'Qisman bajarildi';log('Zakaz yetkazildi',o.id+': '+money(total));save();render();alert(o.status==='Savdoga o‘tdi'?'Zakaz to‘liq bajarildi':'Qisman bajarildi. Qolganini keyingi kuni yetkazishingiz mumkin.');return}
let b=e.target.closest('[data-page]');if(b){nav(b.dataset.page);return}let d=e.target.closest('[data-del]');if(d){let k=d.dataset.del,id=d.dataset.id,x=get(k,id);if(!x)return;if(k==='sales'&&x.fefoGroup){alert('FEFO savdosi bitta operatsiyaga bog‘langan. Uning alohida qatorini o‘chirish bloklangan.');return}if(k==='sales'&&db.returns.some(x=>x.sale===id)){alert('Bu savdoga vozvrat bog‘langan, o‘chirib bo‘lmaydi.');return}if(k==='returns'||k==='disposals'){alert('Hisob yozuvi audit uchun o‘chirilmaydi.');return}if(dependencies(k,id)){alert('Bu yozuv boshqa yozuvlar bilan bog‘langan. O‘chirish mumkin emas.');return}if(!confirm('Yozuv o‘chirilsinmi?'))return;db[k]=db[k].filter(x=>x.id!==id);log('O‘chirish',k+': '+(x.name||x.date||id));save();render();return}if(e.target.id==='export')download('pharma-zaxira-'+date()+'.json',JSON.stringify(db,null,2),'application/json');if(e.target.id==='csv'){let data=[['Sana','Mijoz','Ombor','Dori','Seriya','Yaroqlilik','FEFO operatsiya','Miqdor','Narx','Jami'],...db.sales.map(x=>[x.date,name('pharm',x.pharm),name('wh',x.wh),name('meds',x.med),get('meds',x.med)?.batch||'',get('meds',x.med)?.exp||'',x.fefoGroup?'FEFO-'+String(x.fefoGroup).slice(0,8):'',x.qty,x.price,x.total])];download('savdolar-'+date()+'.csv','\ufeff'+data.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}if(['filter','week','month','all'].includes(e.target.id)){if(e.target.id==='filter'){filters.from=$('#from').value;filters.to=$('#to').value}else if(e.target.id==='all')filters={from:'',to:''};else{let days=e.target.id==='week'?6:29,dt=new Date();dt.setDate(dt.getDate()-days);filters={from:dt.toISOString().slice(0,10),to:date()}}render()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-order-status]')){let o=get('orders',e.target.dataset.orderStatus);if(o&&o.status!=='Savdoga o‘tdi'){o.status=e.target.value;log('Zakaz holati',o.status);save();render()}}});
document.addEventListener('submit',e=>{if(e.target.id==='fefoForm'){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));let qty=Number(o.qty),price=Number(o.price);if(!get('pharm',o.pharm)||!get('wh',o.wh)||!Number.isInteger(qty)||qty<1||!Number.isFinite(price)||price<0){alert('Ma’lumotlarni tekshiring');return}let parts=fefoPlan(o.med,o.wh,qty);if(!parts){alert('Bu dorining yaroqli seriyalarida yetarli qoldiq yo‘q. Ombor va yaroqlilik muddatini tekshiring.');return}let details=parts.map(x=>x.batch+' ('+x.exp+'): '+x.qty+' ta').join('\n');if(!confirm('FEFO taqsimoti:\n'+details+'\nJami: '+money(qty*price)+'\nSavdo tasdiqlansinmi?'))return;let group=uid();for(const part of parts){db.sales.push({id:uid(),pharm:o.pharm,med:part.med,wh:o.wh,qty:part.qty,price,total:part.qty*price,cost:num(get('meds',part.med)?.cost),date:o.date,fefoGroup:group})}log('FEFO savdo',details+'; '+money(qty*price));save();render();alert('FEFO savdo saqlandi. Operatsiya: FEFO-'+String(group).slice(0,8));return}if(e.target.id==='orderForm'){e.preventDefault();let f=e.target,o=Object.fromEntries(new FormData(f)),items=orderItems();if(!get('pharm',o.pharm)||!get('wh',o.wh)||!items.length||items.some(i=>!get('meds',i.med)||!Number.isInteger(i.qty)||i.qty<1||!Number.isFinite(i.price)||i.price<0)){alert('Mijoz, ombor va dorilarni to‘g‘ri to‘ldiring');return}if(o.due<o.date){alert('Yetkazish sanasi zakaz sanasidan oldin bo‘lmasin');return}db.orders.push({...o,id:uid(),items,status:'Yangi'});log('Zakaz qo‘shildi',o.supplier);save();render();alert('Zakaz saqlandi');return}let f=e.target.closest('form[data-kind]');if(!f)return;e.preventDefault();let k=f.dataset.kind,o=Object.fromEntries(new FormData(f));o.id=uid();for(const n of ['qty','price','cost','min','amount'])if(n in o)o[n]=num(o[n]);if(k==='returns'){let sale=get('sales',o.sale);if(!sale){alert('Savdoni tanlang');return}let already=sum(db.returns.filter(x=>x.sale===sale.id),x=>num(x.qty));if(!Number.isInteger(o.qty)||o.qty<1||o.qty>num(sale.qty)-already){alert('Qaytarish miqdori sotilgan va avval qaytarilmagan miqdordan oshmasligi kerak. Qolgan: '+(num(sale.qty)-already));return}if(!confirm(o.qty+' ta '+name('meds',sale.med)+' qaytarilsinmi?'))return;o.pharm=sale.pharm;o.med=sale.med;o.wh=sale.wh;o.price=num(sale.price);o.cost=num(sale.cost);o.total=o.qty*o.price}if(k==='disposals'){if(!get('meds',o.med)||!get('wh',o.wh)||!Number.isInteger(o.qty)||o.qty<1||o.qty>badQty(o.med,o.wh)){alert('Yaroqsiz zaxirada yetarli miqdor yo‘q. Mavjud: '+badQty(o.med,o.wh));return}if(!o.document.trim()){alert('Dalolatnoma raqamini kiriting');return}if(!confirm(o.qty+' ta yaroqsiz dori utilizatsiya hisobiga o‘tkazilsinmi?'))return}if(k==='meds'&&db.meds.some(x=>x.name.toLowerCase()===o.name.toLowerCase()&&x.batch===o.batch)){alert('Dori va seriya takrorlangan');return}if(k==='pharm'&&!get('staff',o.staff)){alert('Avval xodim kiriting');return}if(k==='buys'&&(!get('meds',o.med)||!get('wh',o.wh))){alert('Dori va omborni tanlang');return}if(k==='transfers'){if(!get('meds',o.med)?.exp||get('meds',o.med).exp<date()){alert('Muddati o‘tgan seriyani sotiladigan omborga ko‘chirish bloklandi.');return}if(o.from===o.to){alert('Omborlar turlicha bo‘lishi kerak');return}if(stock(o.med,o.from)<o.qty){alert('Omborda yetarli tovar yo‘q: '+stock(o.med,o.from));return}}if(k==='sales'){if(!get('meds',o.med)?.exp||get('meds',o.med).exp<date()){alert('Seriyaning yaroqlilik muddati o‘tgan yoki kiritilmagan. Savdo taqiqlanadi.');return}if(!get('pharm',o.pharm)||!get('meds',o.med)||!get('wh',o.wh)){alert('Mijoz, dori va omborni tanlang');return}if(stock(o.med,o.wh)<o.qty){alert('Tanlangan omborda yetarli tovar yo‘q: '+stock(o.med,o.wh));return}o.total=o.qty*o.price;o.cost=num(get('meds',o.med)?.cost)}if(k==='payments'&&!get('pharm',o.pharm)){alert('Mijozni tanlang');return}if(k==='plans'&&db.plans.some(x=>x.staff===o.staff&&x.month===o.month)){alert('Bu vakil uchun shu oy rejasi mavjud');return}db[k].push(o);log('Qo‘shish',k+': '+(o.name||o.date||o.month||''));save();render();alert('Saqlandi')});
document.addEventListener('change',async e=>{if(e.target.id!=='import')return;try{let file=e.target.files?.[0];if(!file)return;let data=JSON.parse(await file.text());if(!['meds','pharm','staff','buys','sales','payments'].every(k=>Array.isArray(data[k])))throw Error('Noto‘g‘ri fayl');if(!confirm('Barcha joriy ma’lumotlar zaxiradagi ma’lumotlar bilan almashtirilsinmi?'))return;db=data;for(let k of arrays)if(!Array.isArray(db[k]))db[k]=[];if(!db.wh.length)db.wh=[{id:'main',name:'Markaziy ombor',region:'Toshkent shahri'}];log('Tiklash','JSON zaxira');save();render();alert('Tiklandi')}catch(err){alert('Xatolik: '+err.message)}});save();render();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script></body></html>
